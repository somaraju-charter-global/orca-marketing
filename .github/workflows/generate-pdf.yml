name: Generate Marketing PDF

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Print route URL"
        required: true
      output_name:
        description: "Output PDF filename"
        required: true
        default: "orcaworks-guide.pdf"

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate PDF
        run: npm run pdf -- --url "${{ github.event.inputs.url }}" --out "./exports/${{ github.event.inputs.output_name }}"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketing-pdf
          path: ./exports/${{ github.event.inputs.output_name }}
